---
- name: Create new DigitalOcean droplet
  community.digitalocean.digital_ocean_droplet:
    state: present
    name: "{{ droplet_name }}"
    region: "{{ droplet_region }}"
    size: "{{ droplet_size }}"
    image: "{{ droplet_image }}"
    ssh_keys: ["{{ ssh_key_name }}"]
    wait_timeout: 500
    oauth_token: "{{ do_api_token }}"
  register: new_droplet

- name: Wait for the droplet to be available
  wait_for:
    host: "{{ new_droplet.data.ip_address }}"
    port: 22
    delay: 10
    timeout: 300

- name: Add the new droplet to the inventory
  add_host:
    name: "{{ new_droplet.data.ip_address }}"
    groups: droplets
    ansible_host: "{{ new_droplet.data.ip_address }}"
    ansible_user: root

- name: Display new droplet information
  debug:
    msg: "Droplet created - ID: {{ new_droplet.data.id }}, IP: {{ new_droplet.data.ip_address }}"